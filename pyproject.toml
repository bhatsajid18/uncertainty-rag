# Tool settings only. The code runs as scripts from the repo root
# (python src/rag/chat.py, uvicorn api.main:app --app-dir src, ...), so this is
# not an installable package; dependencies are in the requirements*.txt files.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff's default rule set, written out so it does not change under us
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
