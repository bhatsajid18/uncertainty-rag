# Lint + tests on every push and pull request, and a check that both Docker
# images still build. The tests use small stand-ins for the models and the LLM,
# so no API keys, datasets or model downloads are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU PyTorch (the CUDA build is ~2 GB larger)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Uncertainty pipeline smoke test (tiny fake data)
        run: make uncertainty-smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and UI images
        run: docker compose build
